[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.1.0.dev0"
description = "Auditable offline factor research; independent migration candidate"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "tzdata>=2026.4",
]

[project.optional-dependencies]
execution-binance = ["websockets>=15,<17"]
execution-alpaca = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "pyarrow>=17,<23", "websockets>=15,<17",
]
execution-tradfi = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "exchange-calendars>=4.11,<5",
]
execution-dual = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "pyarrow>=17,<23",
    "websockets>=15,<17", "exchange-calendars>=4.11,<5",
]
strategy-numeric = ["numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3"]
research = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "scipy>=1.13.1,<1.17",
    "scikit-learn>=1.5.2,<1.8", "pyarrow>=17,<23", "matplotlib>=3.8.4,<3.11",
    "PyYAML>=6.0.2,<7", "lightgbm>=4.5,<4.7", "xgboost==2.1.4",
]
alpaca-paper = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "pyarrow>=17,<23", "websockets>=15,<17",
]
suppliers = ["akshare==1.18.88", "baostock==0.8.9"]
pdf = ["pypdf>=5,<7", "openpyxl>=3.1,<4"]
dev = ["pytest>=8.3.5,<9", "pytest-cov>=6.2.1,<8", "build>=1.3,<2"]
cross-market = ["numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "exchange-calendars>=4.11,<5"]
pairs = ["statsmodels>=0.14.4,<0.15"]
binance-equity = ["websockets>=15,<17"]
alpaca-data = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "pyarrow>=17,<23",
    "websockets>=15,<17", "exchange-calendars>=4.11,<5",
]
monte-carlo-cuda = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "scipy>=1.13.1,<1.17",
    "cupy-cuda13x[ctk]>=14,<15", "packaging>=24,<27",
]
monte-carlo-benchmark = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "scipy>=1.13.1,<1.17",
    "psutil>=5.9,<8", "nvidia-ml-py>=12,<14", "packaging>=24,<27", "threadpoolctl>=3.5,<4",
]
monte-carlo-native = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "scipy>=1.13.1,<1.17",
    "ziglang>=0.15,<0.16", "packaging>=24,<27",
]

[project.scripts]
factorlab = "factorlab.cli:main"
factorlab-demo = "factorlab.integrations.binance_futures_trading.demo_cli:main"
factorlab-research = "factorlab.experiments.research_batch:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["factorlab*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/research", "tests/model_readiness", "tests/market_structure", "tests/market_admission", "tests/minute_data", "tests/evidence", "tests/migration", "tests/security", "tests/cross_market", "tests/integrations"]
python_files = ["test_*.py"]
addopts = '-ra -m "not network"'
markers = ["network: external services excluded from offline acceptance", "integration: crosses subsystems", "slow: long running"]

[tool.setuptools.package-data]
factorlab = ["resources/*.yaml", "resources/*.json", "resources/*.py", "console/static/*.html", "console/static/*.css", "console/static/*.js", "research/grid_simulation/*.cu"]

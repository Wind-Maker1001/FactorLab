[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.1.0.dev0"
description = "Auditable offline factor research; independent migration candidate"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.26.4,<2.4", "pandas>=2.2.3,<3", "scipy>=1.13.1,<1.17",
    "scikit-learn>=1.5.2,<1.8", "pyarrow>=17,<23", "matplotlib>=3.8.4,<3.11",
    "PyYAML>=6.0.2,<7", "lightgbm>=4.5,<4.7", "xgboost==2.1.4", "tzdata>=2026.4",
]

[project.optional-dependencies]
suppliers = ["akshare==1.18.88", "baostock==0.8.9"]
pdf = ["pypdf>=5,<7", "openpyxl>=3.1,<4"]
dev = ["pytest>=8.3.5,<9", "pytest-cov>=6.2.1,<8", "build>=1.3,<2"]
cross-market = ["exchange-calendars>=4.11,<5"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["factorlab*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/research", "tests/model_readiness", "tests/market_structure", "tests/market_admission", "tests/minute_data", "tests/evidence", "tests/migration", "tests/security", "tests/cross_market"]
python_files = ["test_*.py"]
addopts = '-ra -m "not network"'
markers = ["network: external services excluded from offline acceptance", "integration: crosses subsystems", "slow: long running"]

[tool.setuptools.package-data]
factorlab = ["resources/*.yaml"]

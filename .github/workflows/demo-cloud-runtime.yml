name: Demo cloud runtime offline acceptance
on:
  push:
    branches: [feat/p8-c01-cloud-runtime, ops/p8-c02-cloud-get-only-acceptance]
  pull_request:
    paths:
      - 'src/factorlab/integrations/binance_futures_trading/**'
      - 'tests/integrations/test_demo_cloud*'
      - 'tests/integrations/test_demo_execute_systemd.py'
      - 'tests/integrations/test_strategy_deployment_s03.py'
      - 'tests/integrations/test_unified_cloud_strategy_s04.py'
      - 'src/factorlab/strategies/**'
      - 'deploy/systemd/**'
      - 'tools/ci/demo_cloud_systemd.py'
      - 'tools/ci/demo_execute_systemd.py'
      - 'tools/ci/binance_mailbox_acceptance.py'
      - 'requirements/execution-binance.txt'
      - 'requirements/execution-tradfi.txt'
      - 'src/factorlab/time_utils.py'
      - 'src/factorlab/experiments/__init__.py'
      - 'src/factorlab/experiments/grid_funding_adaptive.py'
      - '.github/workflows/demo-cloud-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/py314-core.txt pytest
      - run: python -m pip install --no-deps .
      - name: Platform, persistence and runtime regressions
        run: >-
          python -m pytest -q
          tests/integrations/test_demo_cloud_runtime.py
          tests/integrations/test_demo_cloud_monitor.py
          tests/integrations/test_demo_cloud_backup.py
          tests/integrations/test_demo_cloud_backup_systemd.py
          tests/integrations/test_demo_cloud_storage.py
          tests/integrations/test_demo_cloud_credentials.py
          tests/integrations/test_demo_execute_systemd.py
          tests/integrations/test_binance_demo_runtime.py
          tests/integrations/test_demo_continuous_campaign.py
          tests/integrations/test_demo_grid_supervisor.py
          tests/integrations/test_demo_observability.py
          tests/integrations/test_strategy_deployment_s03.py
          tests/integrations/test_unified_cloud_strategy_s04.py
          --junitxml=cloud-offline.xml
      - name: Install offline systemd acceptance unit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --system --home /nonexistent --shell /usr/sbin/nologin factorlab-demo
          sudo install -d -o factorlab-demo -g factorlab-demo -m 700 /var/lib/factorlab-demo
          sudo mkdir -p /opt/factorlab
          sudo "$(command -v python)" -m venv --copies /opt/factorlab/venv
          sudo /opt/factorlab/venv/bin/python -m pip install -r requirements/py314-core.txt
          sudo /opt/factorlab/venv/bin/python -m pip install --no-deps .
          sudo chown -R root:root /opt/factorlab
          sudo chmod -R go-w /opt/factorlab
          sudo cp deploy/systemd/factorlab-demo.service /etc/systemd/system/factorlab-demo-ci.service
          sudo mkdir -p /etc/systemd/system/factorlab-demo-ci.service.d
          printf '%s\n' '[Service]' 'LoadCredential=' 'ExecStart=' 'ExecStart=/opt/factorlab/venv/bin/python -m factorlab.integrations.binance_futures_trading.demo_cloud_runtime run --offline' | sudo tee /etc/systemd/system/factorlab-demo-ci.service.d/offline.conf > /dev/null
          sudo install -o root -g root -m 644 deploy/systemd/factorlab-demo-execute.service /etc/systemd/system/factorlab-demo-execute.service
          sudo install -o root -g root -m 644 deploy/systemd/factorlab-demo-health.service /etc/systemd/system/factorlab-demo-health.service
          sudo install -o root -g root -m 644 deploy/systemd/factorlab-demo-health.timer /etc/systemd/system/factorlab-demo-health.timer
          sudo install -o root -g root -m 644 deploy/systemd/factorlab-demo-daily-report.service /etc/systemd/system/factorlab-demo-daily-report.service
          sudo install -o root -g root -m 644 deploy/systemd/factorlab-demo-daily-report.timer /etc/systemd/system/factorlab-demo-daily-report.timer
          sudo systemctl daemon-reload
          sudo systemd-analyze verify /etc/systemd/system/factorlab-demo-ci.service
          sudo systemd-analyze verify /etc/systemd/system/factorlab-demo-execute.service
          sudo systemd-analyze verify /etc/systemd/system/factorlab-demo-health.service /etc/systemd/system/factorlab-demo-health.timer
          sudo systemd-analyze verify /etc/systemd/system/factorlab-demo-daily-report.service /etc/systemd/system/factorlab-demo-daily-report.timer
          sudo systemd-analyze verify deploy/systemd/factorlab-demo-backup.service deploy/systemd/factorlab-demo-backup.timer
          sudo systemd-analyze verify deploy/systemd/factorlab-demo-strategy-deploy.service deploy/systemd/factorlab-demo-strategy-deploy.timer
      - name: Real systemd backup recovery after SIGTERM and SIGKILL
        if: runner.os == 'Linux'
        run: >-
          sudo env FACTORLAB_TEST_SYSTEMD=1 "$(command -v python)" -m pytest -q
          tests/integrations/test_demo_cloud_backup_systemd.py
          -k restores_original_unit
      - name: Real systemd SIGKILL restart and SIGTERM stop
        if: runner.os == 'Linux'
        run: python -I tools/ci/demo_cloud_systemd.py
      - name: Real systemd Execute acceptance (offline loopback)
        if: runner.os == 'Linux'
        env:
          FACTORLAB_C04_EVIDENCE_OUT: execute-systemd-acceptance.json
        run: python -I tools/ci/demo_execute_systemd.py
      - name: Collect systemd evidence
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo journalctl --no-pager -u factorlab-demo-ci.service > cloud-systemd.log
          sudo systemctl show factorlab-demo-ci.service > cloud-systemd-state.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloud-offline-${{ runner.os }}-py${{ matrix.python }}
          path: |
            cloud-offline.xml
            cloud-systemd.log
            cloud-systemd-state.txt
            cloud-systemd-acceptance.json
            execute-systemd-acceptance.json
          if-no-files-found: error

  lightweight-mailbox:
    name: Lightweight Binance mailbox (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Run Observer and Execute in separate environments over offline HTTP
        env:
          PYTHONPATH: src
        run: |
          python -m venv "$RUNNER_TEMP/binance-execute"
          python -m venv "$RUNNER_TEMP/tradfi-observer"
          execute="$RUNNER_TEMP/binance-execute/bin/python"
          observer="$RUNNER_TEMP/tradfi-observer/bin/python"
          "$execute" -m pip install --only-binary=:all: -r requirements/execution-binance.txt
          "$observer" -m pip install --only-binary=:all: -r requirements/execution-tradfi.txt
          "$execute" -m pip check
          "$execute" -m tools.ci.binance_mailbox_acceptance "$observer" > mailbox-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mailbox-${{ matrix.runner }}
          path: mailbox-results.json
          if-no-files-found: error

  lightweight-mailbox-parity:
    name: Lightweight Binance mailbox parity
    needs: lightweight-mailbox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mailbox-ubuntu-24.04*
      - run: diff -u mailbox-ubuntu-24.04/mailbox-results.json mailbox-ubuntu-24.04-arm/mailbox-results.json

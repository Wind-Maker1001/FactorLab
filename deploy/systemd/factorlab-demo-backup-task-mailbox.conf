[Service]
ReadWritePaths=/var/lib/factorlab-tradfi-observer/task-mailbox
ExecStart=
ExecStart=/opt/factorlab/venv/bin/python -m factorlab.integrations.binance_futures_trading.demo_cloud_backup run-scheduled --state-root ${FACTORLAB_DEMO_STATE_ROOT} --backup-root ${FACTORLAB_DEMO_BACKUP_ROOT} --retention-days ${FACTORLAB_DEMO_BACKUP_RETENTION_DAYS} --min-valid-copies ${FACTORLAB_DEMO_BACKUP_MIN_VALID_COPIES} --recovery-directory ${RUNTIME_DIRECTORY} --task-mailbox /var/lib/factorlab-tradfi-observer/task-mailbox/tasks.sqlite3 --drill

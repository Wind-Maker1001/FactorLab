# Deploy to /etc/systemd/journald.conf.d/factorlab-demo.conf
# Persistent journald retention with strict disk and memory bounds for a 1 GiB Azure VM.
# Note: SystemMaxUse=512M and SystemKeepFree=4G take precedence over MaxRetentionSec=14day;
# 14day is an upper bound, not a guarantee of 14-day retention under high Execute log volume.
# Long-window (24h/72h/7d) monitoring metrics rely on bounded samples.jsonl (48 MiB / 8 days).
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=512M
SystemKeepFree=4G
SystemMaxFileSize=32M
SystemMaxFiles=32
RuntimeMaxUse=32M
MaxRetentionSec=14day
MaxFileSec=1day
SyncIntervalSec=30s

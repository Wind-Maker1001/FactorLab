# Deploy to /etc/systemd/journald.conf.d/factorlab-demo.conf
# Persistent journald retention with strict disk and memory bounds for a 1 GiB Azure VM.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=512M
SystemKeepFree=4G
SystemMaxFileSize=32M
SystemMaxFiles=32
RuntimeMaxUse=32M
MaxRetentionSec=14day
MaxFileSec=1day
SyncIntervalSec=30s
